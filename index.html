<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Thai AI Vision</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;

font-family:'Prompt',sans-serif;

background:
radial-gradient(circle at top,#2a0033 0%,#07000a 50%,#000000 100%);

display:flex;
justify-content:center;
align-items:center;

position:relative;
color:white;
}

/* =========================
BACKGROUND GLOW
========================= */

body::before{
content:"";
position:absolute;

width:800px;
height:800px;

background:
radial-gradient(circle,#ff00c8 0%,transparent 70%);

opacity:0.12;
filter:blur(120px);

animation:floatGlow 8s ease-in-out infinite;
}

body::after{
content:"";
position:absolute;

width:600px;
height:600px;

background:
radial-gradient(circle,#7a00ff 0%,transparent 70%);

opacity:0.1;
filter:blur(120px);

right:-100px;
bottom:-100px;

animation:floatGlow2 10s ease-in-out infinite;
}

@keyframes floatGlow{

0%,100%{
transform:translateY(0px) translateX(0px);
}

50%{
transform:translateY(-20px) translateX(20px);
}

}

@keyframes floatGlow2{

0%,100%{
transform:translateY(0px);
}

50%{
transform:translateY(30px);
}

}

/* =========================
PARTICLES
========================= */

.particles span{
position:absolute;

width:3px;
height:3px;

background:#ff4fd8;
border-radius:50%;

box-shadow:0 0 10px #ff4fd8;

animation:particles 10s linear infinite;
}

.particles span:nth-child(1){
left:10%;
animation-delay:0s;
}

.particles span:nth-child(2){
left:20%;
animation-delay:2s;
}

.particles span:nth-child(3){
left:40%;
animation-delay:4s;
}

.particles span:nth-child(4){
left:60%;
animation-delay:1s;
}

.particles span:nth-child(5){
left:80%;
animation-delay:5s;
}

.particles span:nth-child(6){
left:90%;
animation-delay:3s;
}

@keyframes particles{

0%{
transform:translateY(100vh) scale(0);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-100px) scale(1.5);
opacity:0;
}

}

/* =========================
TOP TITLE
========================= */

.top-title{
position:absolute;

top:40px;
left:50%;

transform:translateX(-50%);

text-align:center;

z-index:10;
}

.logo{

font-family:'Orbitron',sans-serif;

font-size:58px;
font-weight:700;

letter-spacing:4px;

background:
linear-gradient(
90deg,
#ff4fd8,
#00d9ff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:
0 0 15px rgba(255,0,200,0.5),
0 0 30px rgba(0,225,255,0.35);

animation:titleGlow 3s ease-in-out infinite;
}

.top-subtitle{

margin-top:10px;

font-size:15px;
letter-spacing:2px;

color:#d5b4ff;

opacity:0.85;
}

@keyframes titleGlow{

0%,100%{
filter:drop-shadow(0 0 8px #ff00c8);
}

50%{
filter:drop-shadow(0 0 18px #00d9ff);
}

}

/* =========================
CARD
========================= */

.card{
position:relative;

width:460px;

padding:
40px
35px
35px;

margin-top:120px;

border-radius:30px;

background:
rgba(255,255,255,0.05);

backdrop-filter:blur(25px);

display:flex;
flex-direction:column;
align-items:center;

overflow:hidden;

border:
1px solid rgba(255,255,255,0.08);

box-shadow:
0 0 20px rgba(255,0,200,0.2),
0 0 60px rgba(140,0,255,0.15);
}

/* =========================
ANIMATED BORDER
========================= */

.card::before{
content:"";

position:absolute;
inset:-2px;

border-radius:32px;
padding:2px;

background:
linear-gradient(
90deg,
#ff00c8,
#7a00ff,
#00e1ff,
#ff00c8
);

background-size:300% 300%;

-webkit-mask:
linear-gradient(#fff 0 0) content-box,
linear-gradient(#fff 0 0);

-webkit-mask-composite:xor;
mask-composite:exclude;

animation:neonBorder 5s linear infinite;
}

@keyframes neonBorder{

0%{
background-position:0% 50%;
}

100%{
background-position:300% 50%;
}

}

/* =========================
CANVAS
========================= */

.canvas-wrap{
position:relative;

display:flex;
justify-content:center;
align-items:center;

margin:auto;
}

.canvas-wrap::before{
content:"";

position:absolute;
inset:-10px;

border-radius:24px;

background:
linear-gradient(
90deg,
#ff00c8,
#6f00ff,
#00e1ff,
#ff00c8
);

background-size:400% 400%;

filter:blur(20px);

opacity:0.7;

animation:neonBorder 4s linear infinite;

z-index:-1;
}

canvas{
display:block;

background:black;

border-radius:18px;

border:
2px solid rgba(255,255,255,0.1);

cursor:crosshair;
}

/* =========================
BUTTONS
========================= */

.btn-group{
margin-top:20px;

display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
}

button{
padding:12px 20px;

border:none;
border-radius:14px;

font-size:14px;
font-weight:600;

cursor:pointer;

position:relative;
overflow:hidden;

transition:0.3s;

color:white;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(10px);

border:
1px solid rgba(255,255,255,0.08);
}

button::before{
content:"";

position:absolute;

top:0;
left:-100%;

width:100%;
height:100%;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,0.35),
transparent
);

transition:0.6s;
}

button:hover::before{
left:100%;
}

button:hover{
transform:
translateY(-2px)
scale(1.03);

box-shadow:
0 0 20px rgba(255,0,200,0.4);
}

.predict-btn{
background:
linear-gradient(
90deg,
#ff00c8,
#7a00ff
);
}

.admin-btn{
margin-top:18px;
width:100%;

background:
linear-gradient(
90deg,
#1e1e1e,
#3f0f53
);
}

/* =========================
RESULT
========================= */

.result{
margin-top:22px;

width:100%;

padding:14px;

border-radius:14px;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.06);

font-size:16px;
line-height:1.7;

text-align:center;
}

.result b{
color:#00e1ff;
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:700px){

.logo{
font-size:34px;
}

.top-subtitle{
font-size:12px;
}

.card{
width:92%;
margin-top:140px;
padding:
30px
20px
25px;
}

canvas{
width:100%;
height:auto;
}

}

</style>
</head>

<body>

<!-- PARTICLES -->

<div class="particles">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

<!-- TITLE -->

<div class="top-title">

<h1 class="logo">
THAI NUMBER AI
</h1>

<p class="top-subtitle">
AI Handwritten Thai Digit Recognition
</p>

</div>

<!-- CARD -->

<div class="card">

<!-- DRAW AREA -->

<div class="canvas-wrap">

<canvas id="c" width="280" height="280"></canvas>

</div>

<!-- BUTTONS -->

<div class="btn-group">

<button class="predict-btn" onclick="predict()">
Predict
</button>

<button onclick="clearCanvas()">
Clear
</button>

</div>

<!-- RESULT -->

<div class="result" id="out">
Result : -
</div>

<!-- ADMIN -->

<button class="admin-btn"
onclick="window.location.href='/login'">

Admin Access

</button>

</div>

<script>

/* =========================
CANVAS
========================= */

const c = document.getElementById("c");
const ctx = c.getContext("2d");

ctx.fillStyle = "black";
ctx.fillRect(0,0,280,280);

let draw = false;

/* START DRAW */

c.onmousedown = e => {

draw = true;

ctx.beginPath();

ctx.moveTo(
e.offsetX,
e.offsetY
);

};

/* DRAWING */

c.onmousemove = e => {

if(!draw) return;

ctx.lineWidth = 16;
ctx.lineCap = "round";

ctx.strokeStyle = "#ffffff";

ctx.lineTo(
e.offsetX,
e.offsetY
);

ctx.stroke();

};

/* STOP DRAW */

window.onmouseup = () => {
draw = false;
};

/* CLEAR */

function clearCanvas(){

ctx.fillStyle = "black";

ctx.fillRect(
0,
0,
280,
280
);

document.getElementById("out").innerHTML =
"Result : -";

}

/* PREDICT */

async function predict(){

try{

let img = c.toDataURL("image/png");

document.getElementById("out").innerHTML =
"⚡ Processing AI Prediction...";

let res = await fetch("/predict",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
image:img
})

});

let d = await res.json();

/* ERROR */

if(d.error){

document.getElementById("out").innerHTML =
"❌ Error : " + d.error;

return;
}

/* SUCCESS */

document.getElementById("out").innerHTML =
`
✨ Result : <b>${d.result}</b><br>
🎯 Confidence : <b>${d.confidence}%</b>
`;

}
catch(err){

document.getElementById("out").innerHTML =
"❌ Connection Error";

console.log(err);

}

}

</script>

</body>
</html>
